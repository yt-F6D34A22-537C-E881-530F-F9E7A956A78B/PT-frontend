<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Tools</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- assets/apple-touch-icon-v3.png: 端末側のアイコンキャッシュ更新用の別名ファイル。
       アイコン画像を差し替えた際、ファイル名を変えることでキャッシュを回避する用途。
       現時点では未参照だが、将来アイコン更新時にhref側をこちらへ切り替える想定で同梱している。 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
  <div id="particle-background-wrapper" class="particle-canvas-wrapper">
    <div id="particle-canvas" class="particle-canvas"></div>
  </div>

  <header class="app-header">
    <h1 class="app-title">Personal Tools</h1>
  </header>

  <nav class="tab-nav" role="tablist">
    <button type="button" id="tab-btn-ohlcv" class="tab-btn is-active" data-tab-target="tab-panel-ohlcv" role="tab">
      OHLCVマージ
    </button>
    <button type="button" id="tab-btn-ocr" class="tab-btn" data-tab-target="tab-panel-ocr" role="tab">
      画像OCR
    </button>
    <button type="button" id="tab-btn-comingsoon" class="tab-btn" data-tab-target="tab-panel-comingsoon" role="tab">
      Coming Soon...
    </button>
  </nav>

  <main class="tab-content">
    <section id="tab-panel-ohlcv" class="tab-panel is-active" role="tabpanel">
      <form id="ohlcv-merge-form">
        <div class="form-row">
          <label for="ohlcv-files-input" class="form-label">対象JSONファイル（複数選択可）</label>
          <input type="file" id="ohlcv-files-input" name="files" class="form-input" accept=".json" multiple>
        </div>

        <div class="form-row">
          <label for="ohlcv-existing-merged-input" class="form-label">
            既存のマージ済みJSON（任意・追記する場合のみ選択）
          </label>
          <input type="file" id="ohlcv-existing-merged-input" name="existingMerged" class="form-input" accept=".json">
        </div>

        <div class="form-row">
          <label for="ohlcv-codes-input" class="form-label">銘柄コード（カンマ区切り）</label>
          <input type="text" id="ohlcv-codes-input" name="codes" class="form-input" placeholder="1301,1332,1333">
        </div>

        <button type="submit" id="ohlcv-merge-submit" class="btn-primary">マージしてダウンロード</button>
      </form>

      <p id="ohlcv-status-message" class="status-message" role="status"></p>
    </section>

    <section id="tab-panel-ocr" class="tab-panel" role="tabpanel">
      <form id="ocr-form">
        <div class="form-row">
          <label for="ocr-image-input" class="form-label">対象画像ファイル</label>
          <input type="file" id="ocr-image-input" name="image" class="form-input" accept="image/*">
        </div>

        <div class="form-row">
          <span class="form-label">またはクリップボードから貼り付け</span>
          <div id="ocr-paste-zone" class="ocr-paste-zone" tabindex="0">
            ここをクリックして Ctrl+V（Macは⌘+V）で画像を貼り付け
          </div>
        </div>

        <div class="form-row">
          <label for="ocr-lang-select" class="form-label">認識言語</label>
          <select id="ocr-lang-select" name="lang" class="form-input">
            <option value="jpn+eng" selected>日本語＋英語</option>
            <option value="jpn">日本語のみ</option>
            <option value="eng">英語のみ</option>
          </select>
        </div>

        <div class="form-row">
          <img id="ocr-preview-image" class="ocr-preview-image" alt="選択中の画像プレビュー" hidden>
        </div>

        <button type="submit" id="ocr-extract-submit" class="btn-primary">文字列を抽出</button>
      </form>

      <p id="ocr-status-message" class="status-message" role="status"></p>

      <div class="form-row">
        <label for="ocr-result-textarea" class="form-label">抽出結果</label>
        <textarea id="ocr-result-textarea" name="result" class="form-textarea" readonly></textarea>
      </div>

      <button type="button" id="ocr-copy-button" class="btn-primary">クリップボードにコピー</button>
    </section>

    <section id="tab-panel-comingsoon" class="tab-panel" role="tabpanel">
      <p class="coming-soon-text">Coming Soon...</p>
    </section>
  </main>

  <script src="js/vendor/particleNetwork.min.js"></script>
  <script src="js/common/particleBackground.js"></script>
  <script src="js/common/main.js"></script>
  <script src="js/tabs/ohlcvMergeTab.js"></script>
  <script src="js/tabs/comingSoonTab.js"></script>
  <script src="js/tabs/imageOcrTab.js"></script>
</body>
</html>
